name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compute passcode hash
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: |
          if [ -n "$SITE_PASSCODE" ]; then
            echo "VITE_SITE_PASSCODE_HASH=$(printf %s "$SITE_PASSCODE" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          else
            echo "::notice::SITE_PASSCODE secret is not set — the site will deploy without a password gate."
          fi
      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Prepare static output
        run: |
          cp ".output/public/${{ github.event.repository.name }}/index.html" .output/public/404.html
          touch .output/public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
